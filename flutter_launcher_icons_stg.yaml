# dart run flutter_launcher_icons

flutter_launcher_icons:
  android: "ic_launcher_stg"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_background: "#FF5722"
  adaptive_icon_foreground: "assets/png/AppIconSTG.png"
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  image_path: "assets/png/AppIconSTG.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: true
    image_path: "assets/png/AppIconSTG.png"

# dart run flutter_launcher_icons

flutter_launcher_icons:
  android: "ic_launcher"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/png/AppIcon.png"
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  image_path: "assets/png/AppIcon.png"
  web:
    generate: false
    image_path: "assets/png/AppIcon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: false
    image_path: "assets/png/AppIcon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/png/AppIcon.png"
